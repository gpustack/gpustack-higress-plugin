apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: gpustack-generic-proxy-router
  namespace: higress-system
spec:
  # This plugin fully replaces Higress's built-in `model-router` while adding
  # path-driven routing on top. **Disable model-router** when this plugin is
  # deployed (`kubectl -n higress-system edit wasmplugin model-router` →
  # `defaultConfigDisable: true`), otherwise both plugins will write
  # `x-higress-llm-model` and you'll get whichever-priority-wins behaviour.
  #
  # Phase/priority match the GPUStack deployment exactly (gpustack core,
  # gateway/__init__.py): **AUTHN/900** — model-router's original slot. The
  # AUTHN bucket precedes UNSPECIFIED, so downstream consumers in either
  # bucket (header-transformer AUTHN/810, token-usage UNSPECIFIED/400,
  # rate-limit UNSPECIFIED/600, ext-auth AUTHN/360, the whole LB band
  # AUTHN/340-325) all see the final resolved model name.
  #
  # Being first has a second purpose: this is the entry-classification point
  # of the chain. When it pauses in the header phase to buffer the body, the
  # plugins after it (810 and below) have not run their header callbacks yet
  # — so tags derived here from headers *and* the body are visible to every
  # consumer below, including the LB band.
  phase: AUTHN
  priority: 900
  url: oci://<your-registry>/<your-org>/gpustack-generic-proxy-router:1.0.0
  sha256: "<sha256-digest>"
  defaultConfigDisable: false

  defaultConfig:
    # --------------------------------------------------------------
    # Path-driven mode: /model/proxy/{id}/v1/chat/completions
    #   - Extract {id}, look up `aliasNameMapping[id]` → target model.
    #   - Write the target into `targetHeader` and into the body's `modelKey`.
    # If the URL doesn't match `prefix` (or {id} isn't mapped), the plugin
    # falls through to body-driven mode below.
    #
    #    /model/proxy/qwen-alias/v1/chat/completions        → qwen2.5-7b-instruct
    #
    # Naming the instance (needs an LB route): with aliasRegex, {id} may be
    # "{route-id}-{target}". The regex is matched whole against the {id}
    # segment; its `route` group is looked up in aliasNameMapping like any
    # alias, its optional `target` group is the instance or provider the
    # client names within that route. The path outranks the body's `model`.
    # The instance is honoured but the request still goes through
    # gpustack-lb's in-flight reserve; a target that is not a candidate of
    # the route is 404 with `x-gpustack-lb-reject: pin_miss`.
    #
    # The route group is lazy on purpose: a suffix that is not a target
    # shape is absorbed, so `qwen-alias` stays one alias.
    #
    #    /model/proxy/2-7/v1/chat/completions              → route 2, instance 7
    #    /model/proxy/2-provider-5/v1/chat/completions     → route 2, provider 5
    #    /model/proxy/2-7/v1/videos                        → create on instance 7
    #    /model/proxy/qwen-alias-7/v1/chat/completions     → alias qwen-alias, instance 7
    #
    # Without aliasRegex {id} is a plain alias, as it always was.
    # --------------------------------------------------------------
    prefix: "/model/proxy/"
    # aliasRegex: '^(?P<route>[^/]+?)(?:-(?P<target>[0-9]+|provider-[0-9]+))?$'
    targetHeader: "x-higress-llm-model"
    modelKey: "model"
    aliasNameMapping:
      qwen-alias: "qwen2.5-7b-instruct"
      llama-alias: "llama-3.1-8b-instruct"
      gpt4-alias: "gpt-4o"
      # route ids, for the {route-id}-{target} spelling above
      "2": "qwen2.5-7b-instruct"
      # Values can also be "<provider>/<model>" — split happens iff
      # `addProviderHeader` is configured.
      # openai-gpt4: "openai/gpt-4"

    # --------------------------------------------------------------
    # Body-driven mode (model-router parity):
    #   - Triggered on paths matching `enableOnPathSuffix` when path-driven
    #     mode didn't fire.
    #   - Reads `model` from the body (JSON or multipart/form-data) and
    #     writes it into `targetHeader`. Splits `provider/model` when
    #     `addProviderHeader` is set.
    # `enableOnPathSuffix` defaults to OpenAI's standard AI endpoints;
    # override to narrow or widen. Use `["*"]` to match every path.
    # --------------------------------------------------------------
    # enableOnPathSuffix:
    #   - /completions
    #   - /embeddings
    #   - /audio/transcriptions

    # --------------------------------------------------------------
    # Provider/model split (optional). When the resolved target — coming
    # from either aliasNameMapping or the body's `model` field — is of the
    # form "<provider>/<model>", `addProviderHeader` receives the provider
    # half, `modelToHeader` receives the model half, and the body is
    # rewritten to just the model half. `targetHeader` always carries the
    # unsplit value.
    # --------------------------------------------------------------
    # addProviderHeader: "x-higress-llm-provider"
    # modelToHeader: "x-higress-llm-model-final"

    # --------------------------------------------------------------
    # Auto-routing (JSON bodies only). When the body's model field equals
    # `higress/auto`, the last `role:user` message is matched against
    # `rules` (RE2). First match wins; `defaultModel` is the fallback when
    # no rule matches.
    # --------------------------------------------------------------
    # autoRouting:
    #   enable: true
    #   defaultModel: "qwen2.5-7b-instruct"
    #   rules:
    #     - pattern: "(?i)\\bcode\\b"
    #       model: "qwen2.5-coder-7b"
    #     - pattern: "(?i)\\b(image|photo)\\b"
    #       model: "qwen-vl"

    # --------------------------------------------------------------
    # Self-routing video job IDs. Deployment-level like aliasNameMapping:
    # nothing here is per-route, so it belongs in defaultConfig and not in
    # matchRules. Which routes take part is decided by aliasNameMapping
    # (keyed by route id) and by the route name check below.
    #
    #   gpustack_<route-id>-<instance-id>_<native-id>      gpustack_2-7_video_abc
    #   gpustack_<route-id>-provider-<id>_<native-id>      gpustack_2-provider-5_video_abc
    #
    # targetPatterns pair a target with the cluster service names that
    # realise it. Each rule is two regexes whose capture groups correspond
    # by position: what is outside a group is a regex (any model), what is
    # inside a group is the mapped value.
    #
    #   target "2"          ->  the candidate  model-<model>-2
    #   service model-42-2  ->  the target "2", written into the wrapped ID
    #
    # Unset, they are the two GPUStack rules below. They MUST be the same
    # list on gpustack-lb, which reads every candidate through the same
    # rule to compare it with a pin; a custom list replaces the defaults.
    # `target` must be literals and capture groups only (nothing else can
    # be rebuilt from a service name), the group counts must be equal, a
    # target must not contain `_` (the ID's divider), and the `target`
    # regexes must not overlap: a target is claimed by the first rule that
    # matches it.
    #
    # targetPatterns:
    #   - target: '^(\d+)$'
    #     cluster: 'model-\d+-(\d+)'
    #   - target: '^provider-(\d+)$'
    #     cluster: 'provider-(\d+)'
    #
    # The same two-part spelling is accepted as a path-driven alias, with
    # which a client names the instance for an ordinary request:
    #   /model/proxy/2-7/v1/chat/completions   -> route 2, instance 7
    # It is honoured but still goes through gpustack-lb's in-flight reserve.
    #
    # The route id names the model through aliasNameMapping above -- the same
    # key as /model/proxy/{id} -- and the literal `provider-` tells a provider
    # target from an instance one. With both fields absent the video branch
    # never runs; a partial set is a config error.
    #
    # videoRegexes      GET/DELETE paths; named groups `target` and `origin`
    #                   (`[^/]+`, never `.+`). `path` is the upstream path.
    # videoIdRewriteOnRouteNamePrefix  the create/status/delete response `id` is
    #                   wrapped only when Envoy's route_name starts with one of
    #                   these; the digits after it are the route id.
    #
    # POST /v1/videos needs no regex: it is body-driven, so `/videos` and
    # `/videos/sync` must be in enableOnPathSuffix; it is never replayed.
    # --------------------------------------------------------------
    # videoRegexes:
    #   - regex: '^/v1/videos/gpustack_(?P<target>[^_]+)_(?P<origin>[^/]+)$'
    #     path: "/v1/videos/{origin}"
    #   - regex: '^/v1/videos/gpustack_(?P<target>[^_]+)_(?P<origin>[^/]+)/content$'
    #     path: "/v1/videos/{origin}/content"
    # videoIdRewriteOnRouteNamePrefix:
    #   - "ai-route-route-"

  # You can also override per ingress / route, e.g. enable only on a specific AI route:
  # matchRules:
  #   - ingress:
  #       - ai-route-internal.internal
  #     configDisable: false
  #     config:
  #       prefix: "/llm/route/"
  #       targetHeader: "x-higress-llm-model"
  #       aliasNameMapping:
  #         internal-fast: "qwen2.5-7b-instruct"
  #         internal-smart: "qwen2.5-72b-instruct"
