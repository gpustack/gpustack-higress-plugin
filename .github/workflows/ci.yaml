name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  version-guard:
    runs-on: ubuntu-latest
    # AGENTS.md plugin versioning policy: between two tags each plugin
    # bumps at most once; unchanged plugins keep their version. The job
    # diffs the tree against the most recent tag reachable from the PR
    # base (falling back to HEAD's nearest tag on branch pushes).
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check plugin version bumps
        run: |
          # Window semantics (same for PR and push events):
          #   BASE = merge-base of this change and the base branch —
          #          attribution: only THIS change's commits are judged;
          #   TAG  = latest release tag on the base branch — the release
          #          window: a follow-up PR may RETAIN a version already
          #          bumped in the window instead of paying a second bump.
          BASE=""; TAG=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --no-tags
            BASE="$(git merge-base origin/${{ github.base_ref }} HEAD || echo "origin/${{ github.base_ref }}")"
            TAG="$(git describe --tags --abbrev=0 origin/${{ github.base_ref }} 2>/dev/null || echo "$BASE")"
          else
            TAG="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo HEAD)"
            BASE="$TAG"
          fi
          bash scripts/version-guard.sh "$BASE" "$TAG"

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== Go Tests ==========
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: extensions/*/go.sum

      - name: Run Go tests
        run: make test

      # ========== Python Lint ==========
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Run lint (with auto-fix)
        run: make lint

      # ========== Check for uncommitted changes ==========
      - name: Check for uncommitted changes
        run: make check-dirty

      # ========== Build whl via Docker ==========
      # Uses the same Dockerfile as push/release: compiles Go plugins, fetches remote
      # OCI plugins via oras, and runs verify_whl.py (full check) as part of the build.
      # uv.lock is required by the Dockerfile COPY step; generate it here since it is
      # not committed to git.
      - name: Generate uv.lock
        run: uv lock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build wheel via Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: whl-output
          outputs: type=local,dest=./dist
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show build artifacts
        run: ls -lh dist/
